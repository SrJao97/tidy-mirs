project:
  type: website
  render:
    - "*.qmd"
    - "howto/*.qmd"
    - "!setup.qmd"
    - "!reading-spectra.qmd"
    - "!to-read.qmd"

website:
  title: "Soil mid-infrared spectroscopy with tidymodels"
  description: "A one-week course on soil mid-infrared spectroscopy, taught top-down with the tidyverse and tidymodels."
  repo-url: https://github.com/franckalbinet/tidy-mirs
  repo-actions: [edit, issue]
  page-footer:
    left: "Franck Albinet"
  sidebar:
    title: "SOIl MIR SPECTROSCOPY"
    style: docked
    contents:
      - text: Home
        href: index.qmd
      - section: "Foundations"
        contents:
          - 0-getting-setup.qmd
          - 1-full-pipeline.qmd
          - 2-loading-data.qmd
          - 3-eda.qmd
          - 4-feature-engineering.qmd
          - 5-outlier-detection.qmd
          - 6-evaluating-performance.qmd
      - section: "Worked example"
        contents:
          - 7-preparing-ossl.qmd
          - 8-kex-ossl-pipeline.qmd
      - section: "Going further"
        contents:
          - howto/tuning-savitzky-golay.qmd

bibliography: references.bib

format:
  html:
    theme: [cosmo, custom.scss]
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&family=Source+Code+Pro&display=swap" rel="stylesheet">
    toc: true
    code-fold: false
    code-copy: hover
    code-block-border-left: false
    grid:
      sidebar-width: 300px
      body-width: 750px

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  fig-width: 6
  fig-height: 4
knitr:
  opts_chunk:
    fig.align: center

